[workspace]
resolver = "2"
members = [
    "crates/feather-core",
    "crates/feather-pdf",
    "crates/feather-image",
    "crates/feather-app",
    "crates/feather-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Dr. Sohil Momin"]
repository = "https://github.com/drsamonline/feather"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
