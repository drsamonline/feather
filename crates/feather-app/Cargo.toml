[package]
name = "feather-app"
description = "The Feather window: a document, a scrollbar and nothing else"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "feather-viewer"
path = "src/main.rs"

[dependencies]
feather-core = { path = "../feather-core" }
feather-pdf = { path = "../feather-pdf" }
feather-image = { path = "../feather-image" }
feather-epub = { path = "../feather-epub" }
feather-sheet = { path = "../feather-sheet" }
feather-slide = { path = "../feather-slide" }
# The system file picker. The D-Bus portal backend, not GTK: a viewer that
# links GTK is no longer a single binary with no system libraries.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
feather-text = { path = "../feather-text" }
winit = "0.30"
softbuffer = "0.4"
arboard = "3"
global-hotkey = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
