[package]
name = "feather-app"
description = "The Feather window: a document, a scrollbar and nothing else"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "feather-viewer"
path = "src/main.rs"

[dependencies]
feather-core = { path = "../feather-core" }
feather-pdf = { path = "../feather-pdf" }
feather-image = { path = "../feather-image" }
feather-epub = { path = "../feather-epub" }
feather-sheet = { path = "../feather-sheet" }
feather-text = { path = "../feather-text" }
winit = "0.30"
softbuffer = "0.4"
arboard = "3"
global-hotkey = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
