[package]
name = "feather-sheet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spreadsheet pipeline: XLSX to a scrollable grid, rendered through the same tile cache as everything else"

[dependencies]
feather-core = { path = "../feather-core" }
feather-text = { path = "../feather-text" }
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
