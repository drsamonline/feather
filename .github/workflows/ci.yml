name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build and test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Linux windowing headers
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev fonts-dejavu-core

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format (advisory)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --workspace --release

      - name: M0 smoke test (render page 1)
        shell: bash
        run: |
          cargo run --release -p feather-cli -- info tests/fixtures/minimal.pdf
          out="$RUNNER_TEMP/m0.png"
          cargo run --release -p feather-cli -- render tests/fixtures/minimal.pdf 1 -s 2.0 -o "$out"
          # Wrapping is font-dependent: the same text breaks at different words
          # on Ubuntu, macOS and Windows, so a phrase assertion has to ignore
          # line breaks or it fails on whichever runner picked a wider face.
          flat() { printf '%s' "$1" | tr '\n' ' ' | tr -s ' '; }
          has() {
            case "$(flat "$1")" in
              *"$2"*) ;;
              *) echo "::error::$3"; exit 1 ;;
            esac
          }
          check_png() {
            magic=$(head -c 4 "$1" | od -An -tx1 | tr -d ' \n')
            echo "rendered PNG magic for $1: $magic"
            if [ "$magic" != "89504e47" ]; then
              echo "::error::$1 is not a PNG"
              exit 1
            fi
          }
          check_png "$out"

          # A still image, and a comic whose page order only comes out right
          # with natural sorting (page1, page2, page10).
          cargo run --release -p feather-cli -- render tests/fixtures/tiny.png 1 -o "$RUNNER_TEMP/tiny.png"
          check_png "$RUNNER_TEMP/tiny.png"

          cargo run --release -p feather-cli -- info tests/fixtures/pages.cbz
          cargo run --release -p feather-cli -- render tests/fixtures/pages.cbz 3 -o "$RUNNER_TEMP/page3.png"
          check_png "$RUNNER_TEMP/page3.png"

          # Reflowable: the one format that has to lay text out itself.
          cargo run --release -p feather-cli -- info tests/fixtures/book.epub
          cargo run --release -p feather-cli -- render tests/fixtures/book.epub 1 -o "$RUNNER_TEMP/book.png"
          check_png "$RUNNER_TEMP/book.png"

          # The headless half of selection: the text layer a copy would use.
          text=$(cargo run --release -p feather-cli -- text tests/fixtures/book.epub)
          echo "$text" | head -3
          case "$text" in
            *"Chapter One"*) ;;
            *) echo "::error::EPUB text layer did not contain the heading"; exit 1 ;;
          esac
          case "$text" in
            *"café"*) ;;
            *) echo "::error::entity decoding failed in the text layer"; exit 1 ;;
          esac
          # The spine lists both chapters; nav.xhtml is in the manifest but not
          # in the spine, so it must not appear.
          case "$text" in
            *"Chapter Two"*) ;;
            *) echo "::error::the spine did not include the second chapter"; exit 1 ;;
          esac
          case "$text" in
            *"Contents"*) echo "::error::navigation leaked into the book"; exit 1 ;;
          esac

          # CBR is a RAR archive and there is no permissive Rust decoder, so it
          # is handed to an external tool. This fixture is not a real archive —
          # it exists to prove the failure explains itself either way, whether
          # the runner has an extractor or not.
          if cbr_out=$(cargo run --release -p feather-cli -- info tests/fixtures/fake.cbr 2>&1); then
            echo "::error::a RAR archive should not have opened"
            exit 1
          fi
          echo "$cbr_out" | tail -2
          case "$cbr_out" in
            *RAR*) ;;
            *) echo "::error::the CBR failure did not say what went wrong"; exit 1 ;;
          esac

          # Photoshop: the composite at the end of a layered file, decoded here
          # because the image crate has no PSD.
          cargo run --release -p feather-cli -- info tests/fixtures/artwork.psd
          cargo run --release -p feather-cli -- render tests/fixtures/artwork.psd 1 -o "$RUNNER_TEMP/psd.png"
          check_png "$RUNNER_TEMP/psd.png"

          # OpenDocument: the same three pipelines, another dialect.
          cargo run --release -p feather-cli -- info tests/fixtures/notes.odt
          odt_text=$(cargo run --release -p feather-cli -- text tests/fixtures/notes.odt)
          echo "--- odt text (${#odt_text} chars) ---"; echo "$odt_text"; echo "--- end ---"
          has "$odt_text" "Feather reads OpenDocument" "the ODT lost its heading"
          has "$odt_text" "café" "the ODT lost its accents"
          case "$odt_text" in
            *"<text:span"*) echo "::error::markup leaked into the ODT text"; exit 1 ;;
          esac

          cargo run --release -p feather-cli -- info tests/fixtures/talk.odp
          cargo run --release -p feather-cli -- render tests/fixtures/talk.odp 2 -o "$RUNNER_TEMP/odp.png"
          check_png "$RUNNER_TEMP/odp.png"
          odp_text=$(cargo run --release -p feather-cli -- text tests/fixtures/talk.odp)
          echo "--- odp text (${#odp_text} chars) ---"; echo "$odp_text"; echo "--- end ---"
          has "$odp_text" "Feather opens OpenDocument decks" "the ODP lost its title"
          has "$odp_text" "A second ODP slide" "the second ODP slide is missing"

          cargo run --release -p feather-cli -- info tests/fixtures/ledger.ods
          cargo run --release -p feather-cli -- render tests/fixtures/ledger.ods 1 -o "$RUNNER_TEMP/ods.png"
          check_png "$RUNNER_TEMP/ods.png"
          ods_text=$(cargo run --release -p feather-cli -- text tests/fixtures/ledger.ods)
          ods_flat=$(flat "$ods_text")
          for word in Item Cost Paper 240; do
            case "$ods_flat" in
              *"$word"*) ;;
              *) echo "::error::the ODS lost '$word'"; exit 1 ;;
            esac
          done

          # Presentations: slides carry their own coordinates, so this is a
          # draw-where-the-file-says job rather than a layout engine.
          cargo run --release -p feather-cli -- info tests/fixtures/deck.pptx
          cargo run --release -p feather-cli -- render tests/fixtures/deck.pptx 2 -o "$RUNNER_TEMP/slide.png"
          check_png "$RUNNER_TEMP/slide.png"
          slide_text=$(cargo run --release -p feather-cli -- text tests/fixtures/deck.pptx)
          has "$slide_text" "Feather opens decks" "the deck lost its title"
          has "$slide_text" "A second slide" "the second slide is missing"

          # Word files: paragraphs and heading styles, through the same reflow
          # engine as a book.
          cargo run --release -p feather-cli -- info tests/fixtures/letter.docx
          cargo run --release -p feather-cli -- render tests/fixtures/letter.docx 1 -o "$RUNNER_TEMP/docx.png"
          check_png "$RUNNER_TEMP/docx.png"
          docx_text=$(cargo run --release -p feather-cli -- text tests/fixtures/letter.docx)
          # Print what came back before judging it: the last failure here said
          # "lost its title" and showed nothing at all, which cost a run.
          echo "--- docx text (${#docx_text} chars) ---"
          echo "$docx_text"
          echo "--- end ---"
          has "$docx_text" "Feather reads Word files" "the Word file lost its title"
          has "$docx_text" "A heading, kept as a heading" "the Word file lost its heading"
          has "$docx_text" "café" "a run split across runs lost its accents"
          cargo run --release -p feather-cli -- find tests/fixtures/letter.docx zephyr >/dev/null

          # Spreadsheets: a workbook is a zip of XML, and a sheet is drawn as one
          # large page rather than paginated.
          cargo run --release -p feather-cli -- info tests/fixtures/table.xlsx
          cargo run --release -p feather-cli -- render tests/fixtures/table.xlsx 1 -o "$RUNNER_TEMP/sheet.png"
          check_png "$RUNNER_TEMP/sheet.png"
          sheet_text=$(cargo run --release -p feather-cli -- text tests/fixtures/table.xlsx)
          for word in Region Units Revenue North 48750.5; do
            sheet_flat=$(flat "$sheet_text")
          case "$sheet_flat" in
              *"$word"*) ;;
              *) echo "::error::the sheet lost '$word'"; exit 1 ;;
            esac
          done

          # Plain text and Markdown, through the same reflow engine as a book.
          cargo run --release -p feather-cli -- info tests/fixtures/notes.md
          cargo run --release -p feather-cli -- render tests/fixtures/notes.md 1 -o "$RUNNER_TEMP/notes.png"
          check_png "$RUNNER_TEMP/notes.png"
          note_text=$(cargo run --release -p feather-cli -- text tests/fixtures/notes.md)
          has "$note_text" "Feather notes" "markdown heading did not reach the text layer"
          case "$note_text" in
            *"# Feather"*) echo "::error::markdown syntax leaked into the text"; exit 1 ;;
          esac
          cargo run --release -p feather-cli -- find tests/fixtures/notes.md zephyr >/dev/null

          # Search, headlessly: same text layers and same matcher as the bar.
          # The fixture says "chapter" three times: two headings and one in prose.
          # If that number changes, the fixture changed — the test should say so.
          hits=$(cargo run --release -p feather-cli -- find tests/fixtures/book.epub chapter 2>&1)
          echo "$hits"
          case "$hits" in
            *"3 matches"*) ;;
            *) echo "::error::search found the wrong number of hits"; exit 1 ;;
          esac

      - name: Render the interface with no display
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shots
          ./target/release/feather-viewer --screenshot shots/epub.png tests/fixtures/book.epub
          ./target/release/feather-viewer --screenshot shots/pdf.png tests/fixtures/minimal.pdf

          # A blank frame compresses to almost nothing. This will not catch a
          # subtle layout regression, but it will catch "the page stopped
          # rendering at all", which is the failure that matters.
          for f in shots/*.png; do
            size=$(stat -c%s "$f")
            echo "$f — $size bytes"
            if [ "$size" -lt 10000 ]; then
              echo "::error::$f is suspiciously small; the frame is probably blank"
              exit 1
            fi
          done

      - name: The text still lands where it did
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          # A blank-frame check cannot see a renderer that draws every glyph in
          # the wrong place. The face is pinned so the baseline means the same
          # thing on every machine; without that, the same page scored 0% here
          # and 14% on a runner with different fonts installed.
          FEATHER_FONT=tests/fixtures/fonts/DejaVuSans-subset.ttf \
            ./target/release/feather-viewer --screenshot shots/latin.png tests/fixtures/latin.txt
          python3 -m pip install --quiet pillow
          python3 tests/compare_render.py shots/latin.png tests/fixtures/latin-baseline.png

      - name: Keep the screenshots
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: interface-screenshots
          path: shots/*.png
          if-no-files-found: error

      - name: Does the landing page still quote this size?
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          size=$(stat -c%s target/release/feather-viewer)
          mb=$(awk "BEGIN { printf \"%.1f\", $size/1048576 }")
          # The tilde is optional: the page may quote "9.7 MB" or "~9.7 MB".
          stated=$(grep -oE '~?[0-9.]+ MB' docs/index.html | head -1 | tr -dc '0-9.' || true)
          echo "measured ${mb} MB, landing page says ${stated} MB"
          awk -v m="$mb" -v s="$stated" 'BEGIN {
            if (s == "") { exit 0 }
            diff = (m > s) ? m - s : s - m
            if (diff / s > 0.15) { exit 1 }
          }' || {
            echo "::error::the landing page quotes ${stated} MB; the binary is ${mb} MB"
            exit 1
          }

      - name: Report binary size
        shell: bash
        run: |
          # The viewer is the number that matters: §8 budgets it at 20 MB.
          ext=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then ext=".exe"; fi
          for name in feather-viewer feather; do
            bin="target/release/$name$ext"
            [ -f "$bin" ] || continue
            size=$(stat -c%s "$bin" 2>/dev/null || stat -f%z "$bin")
            echo "$name: $((size/1024)) KB"
            echo "### $name: $((size/1024)) KB on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$name" = "feather-viewer" ] && [ "$size" -gt 20971520 ]; then
              echo "::error::$name is over the 20 MB budget in docs/plan.html §8"
              exit 1
            fi
          done

  budget:
    name: dependency budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Count direct dependencies
        run: |
          # The plan sets a ceiling of 25 external crates (docs/plan.html §8).
          # Only keys inside a [dependencies] table count, and only when they
          # are not path dependencies — our own crates are not a budget item.
          # (The first version of this counted `name =` and `path =` keys from
          # [[bin]] tables too, which is how it silently reported 30.)
          # Counted per distinct crate, not per manifest line: `image` appears in
          # three manifests and `zip` in two, and the plan's budget is about how
          # many third-party crates the project depends on.
          total=$(awk '
            /^\[/ { in_deps = ($0 ~ /^\[(.*\.)?dependencies\]/); next }
            in_deps && /^[A-Za-z0-9_-]+[[:space:]]*=/ {
              if ($0 !~ /path[[:space:]]*=/) {
                split($0, parts, "=");
                gsub(/[[:space:]]/, "", parts[1]);
                print parts[1]
              }
            }
          ' $(find crates -name Cargo.toml | sort) | sort -u | wc -l)
          echo "external dependencies: $total"
          echo "### external dependencies: $total / 25" >> "$GITHUB_STEP_SUMMARY"

          # The landing page quotes this number. A stale number on a page that
          # claims to be checked on every push is worse than no number at all.
          stated=$(grep -oE '[0-9]+ crates' docs/index.html | head -1 | grep -oE '[0-9]+')
          if [ -n "$stated" ] && [ "$stated" != "$total" ]; then
            echo "::error::docs/index.html says $stated crates; the workspace has $total"
            exit 1
          fi
          echo "landing page agrees: $stated crates"
          if [ "$total" -gt 25 ]; then
            echo "::error::over the §8 budget of 25 external dependencies"
            exit 1
          fi

  packaging:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux desktop entry installs, advertises the right formats, and uninstalls
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/prefix"
          mkdir -p "$prefix/bin"
          printf '#!/bin/sh\n' > "$prefix/bin/feather-viewer"
          chmod +x "$prefix/bin/feather-viewer"

          bash packaging/linux/install.sh --prefix "$prefix" --dry-run

          entry="$prefix/share/applications/feather.desktop"
          test -f "$entry" || { echo "::error::no desktop entry written"; exit 1; }
          grep -q '^\[Desktop Entry\]' "$entry" || { echo "::error::entry has no header"; exit 1; }

          for mime in application/pdf application/epub+zip application/vnd.comicbook+zip image/png; do
            grep -q "MimeType=.*$mime" "$entry" || { echo "::error::entry does not advertise $mime"; exit 1; }
          done

          # A file association is a promise, and it cuts both ways: the entry
          # must claim the six Office formats we now read, and must not claim
          # one we do not. RTF is the standing example of the latter.
          for mime in \
            application/vnd.openxmlformats-officedocument.wordprocessingml.document \
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet \
            application/vnd.openxmlformats-officedocument.presentationml.presentation \
            application/vnd.oasis.opendocument.text \
            application/vnd.oasis.opendocument.spreadsheet \
            application/vnd.oasis.opendocument.presentation \
            application/vnd.comicbook-rar \
            image/vnd.adobe.photoshop
          do
            grep -q "MimeType=.*$mime" "$entry" || { echo "::error::entry does not advertise $mime"; exit 1; }
          done

          if grep -q 'application/rtf' "$entry"; then
            echo "::error::entry claims RTF, which the viewer cannot open"
            exit 1
          fi

          grep -q "Exec=\"$prefix/bin/feather-viewer\" %F" "$entry" || { echo "::error::Exec does not point at the binary"; exit 1; }

          bash packaging/linux/install.sh --prefix "$prefix" --uninstall --dry-run
          test ! -f "$entry" || { echo "::error::uninstall left the entry behind"; exit 1; }

      - name: Windows script parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'packaging/windows/install.ps1'),
            [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }; exit 1 }
          Write-Host "install.ps1 parses"
