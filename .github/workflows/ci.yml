name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Linux windowing headers
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format (advisory)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --workspace --release

      - name: M0 smoke test (render page 1)
        shell: bash
        run: |
          cargo run --release -p feather-cli -- info tests/fixtures/minimal.pdf
          out="$RUNNER_TEMP/m0.png"
          cargo run --release -p feather-cli -- render tests/fixtures/minimal.pdf 1 -s 2.0 -o "$out"
          magic=$(head -c 4 "$out" | od -An -tx1 | tr -d ' \n')
          echo "rendered PNG magic: $magic"
          if [ "$magic" != "89504e47" ]; then
            echo "::error::render produced something that is not a PNG"
            exit 1
          fi

      - name: Report binary size
        shell: bash
        run: |
          # The viewer is the number that matters: §8 budgets it at 20 MB.
          ext=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then ext=".exe"; fi
          for name in feather-viewer feather; do
            bin="target/release/$name$ext"
            [ -f "$bin" ] || continue
            size=$(stat -c%s "$bin" 2>/dev/null || stat -f%z "$bin")
            echo "$name: $((size/1024)) KB"
            echo "### $name: $((size/1024)) KB on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$name" = "feather-viewer" ] && [ "$size" -gt 20971520 ]; then
              echo "::error::$name is over the 20 MB budget in docs/plan.html §8"
              exit 1
            fi
          done

  budget:
    name: dependency budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Count direct dependencies
        run: |
          # The plan sets a ceiling of 25 direct crates (docs/plan.html §8).
          # This is a coarse guard, not a substitute for cargo-deny.
          total=$(grep -rhoE '^[a-z0-9_-]+ = ' --include=Cargo.toml crates/ | wc -l)
          echo "declared dependencies: $total"
          echo "### declared dependencies: $total / 25" >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -gt 25 ]; then
            echo "Over the §8 budget of 25 direct dependencies."
            exit 1
          fi
